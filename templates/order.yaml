      RouteKey: "GET /order/listOrders"
      Target: !Sub "integrations/${ListOrdersIntegration}"

  ListOrdersPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ListOrdersFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApiId}/*/*"

  GetOrderIntegration:
