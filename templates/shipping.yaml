        EntryPoints:
          - src/functions/shipping/updateShipment/handler.ts
        External:
          - "/opt/nodejs/*"

  CancelShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-cancelShipment"
      CodeUri: ../
      Handler: src/functions/shipping/cancelShipment/handler.handler
