    Properties:
      ApiId: !Ref HttpApiId
      RouteKey: "POST /shipping/calculateShipping"
      Target: !Sub "integrations/${CalculateShippingIntegration}"

  CalculateShippingPermission:
    Type: AWS::Lambda::Permission
    Properties:
