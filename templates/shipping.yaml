AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: shipping service

Parameters:
  AppEnvironment:
    Type: String
    Default: dev
    Description: Deployment environment; every stage-scoped resource name is built from it
  HttpApiId:
    Type: String
    Description: The project's shared HTTP API; this service attaches its routes to it
  EnvDatabaseUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: DATABASE_URL environment variable

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-shared"
      Description: Shared utilities attached to every function
      ContentUri: ../src/shared/nodejs
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs20.x

  ListShippingMethodsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-listShippingMethods"
      CodeUri: ../
      Handler: src/functions/shipping/listShippingMethods/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/listShippingMethods/handler.ts
        External:
          - "/opt/nodejs/*"

  GetShippingMethodFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-getShippingMethod"
      CodeUri: ../
      Handler: src/functions/shipping/getShippingMethod/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/getShippingMethod/handler.ts
        External:
          - "/opt/nodejs/*"

  CalculateShippingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-calculateShipping"
      CodeUri: ../
      Handler: src/functions/shipping/calculateShipping/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/calculateShipping/handler.ts
        External:
          - "/opt/nodejs/*"

  CreateShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-createShipment"
      CodeUri: ../
      Handler: src/functions/shipping/createShipment/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/createShipment/handler.ts
        External:
          - "/opt/nodejs/*"

  GetShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-getShipment"
      CodeUri: ../
      Handler: src/functions/shipping/getShipment/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/getShipment/handler.ts
        External:
          - "/opt/nodejs/*"

  TrackShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-trackShipment"
      CodeUri: ../
      Handler: src/functions/shipping/trackShipment/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/shipping/trackShipment/handler.ts
        External:
          - "/opt/nodejs/*"

  UpdateShipmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-updateShipment"
      CodeUri: ../
      Handler: src/functions/shipping/updateShipment/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
