AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: auth service

Parameters:
  AppEnvironment:
    Type: String
    Default: dev
    Description: Deployment environment; every stage-scoped resource name is built from it
  HttpApiId:
    Type: String
    Description: The project's shared HTTP API; this service attaches its routes to it
  EnvDatabaseUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: DATABASE_URL environment variable

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-shared"
      Description: Shared utilities attached to every function
      ContentUri: ../src/shared/nodejs
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs20.x

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-login"
      CodeUri: ../
      Handler: src/functions/auth/login/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/auth/login/handler.ts
        External:
          - "/opt/nodejs/*"

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-register"
      CodeUri: ../
      Handler: src/functions/auth/register/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
