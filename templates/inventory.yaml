AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: inventory service

Parameters:
  AppEnvironment:
    Type: String
    Default: dev
    Description: Deployment environment; every stage-scoped resource name is built from it
  HttpApiId:
    Type: String
    Description: The project's shared HTTP API; this service attaches its routes to it
  EnvDatabaseUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: DATABASE_URL environment variable

Globals:
  Function:
    Timeout: 10
    MemorySize: 128

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-shared"
      Description: Shared utilities attached to every function
      ContentUri: ../src/shared/nodejs
      CompatibleRuntimes:
        - nodejs20.x
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: nodejs20.x

  GetInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-getInventory"
      CodeUri: ../
      Handler: src/functions/inventory/getInventory/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/inventory/getInventory/handler.ts
        External:
          - "/opt/nodejs/*"

  UpdateInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-updateInventory"
      CodeUri: ../
      Handler: src/functions/inventory/updateInventory/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/inventory/updateInventory/handler.ts
        External:
          - "/opt/nodejs/*"

  ReserveStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-reserveStock"
      CodeUri: ../
      Handler: src/functions/inventory/reserveStock/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/inventory/reserveStock/handler.ts
        External:
          - "/opt/nodejs/*"

  ReleaseStockFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "test-cli-${AppEnvironment}-releaseStock"
      CodeUri: ../
      Handler: src/functions/inventory/releaseStock/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Minify: false
        Target: es2020
        Sourcemap: true
        EntryPoints:
          - src/functions/inventory/releaseStock/handler.ts
        External:
          - "/opt/nodejs/*"

  ListLowStockFunction:
