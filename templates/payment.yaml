      FunctionName: !Sub "test-cli-${AppEnvironment}-refundPayment"
      CodeUri: ../
      Handler: src/functions/payment/refundPayment/handler.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Environment:
        Variables:
          APP_ENVIRONMENT: !Ref AppEnvironment
          DATABASE_URL: !Ref EnvDatabaseUrl
      Layers:
        - !Ref SharedLayer
    Metadata:
      BuildMethod: esbuild
